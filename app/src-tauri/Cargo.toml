[package]
name = "nasmirror"
version = "0.9.0"
description = "Mirror folders to a NAS or drives with Robocopy, with optional versioned snapshots via Restic"
authors = ["Adrián Barriuso"]
license = "MIT"
repository = "https://github.com/abarriuso/nasmirror"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync", "time", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
regex-lite = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinSock",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
